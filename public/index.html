<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ClipForge — Preview & Trim HD</title>
<style>
  :root {
    --bg: #030712; --panel: rgba(255,255,255,0.04); --panel-border: rgba(34,211,238,0.25);
    --cyan: #22d3ee; --cyan-bright: #67e8f9; --text: #e5f6fb; --text-dim: #7c8b96; --danger: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
  .card { width: 100%; max-width: 560px; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 24px; padding: 32px; backdrop-filter: blur(20px); box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(34,211,238,0.08); }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .logo-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 12px 3px var(--cyan); }
  h1 { font-size: 1.4rem; margin: 0; background: linear-gradient(90deg, #fff, var(--cyan-bright)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .subtitle { color: var(--text-dim); font-size: 0.85rem; margin: 0 0 20px 0; }
  label { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--cyan-bright); margin-bottom: 6px; font-weight: 600; }
  .field { margin-bottom: 16px; }
  input[type="text"], input[type="url"] { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03); color: var(--text); font-size: 0.92rem; outline: none; }
  input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(34,211,238,0.15); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  video { width: 100%; border-radius: 14px; margin: 14px 0; background: #000; display: none; }
  button { width: 100%; padding: 14px; border: none; border-radius: 14px; font-weight: 700; cursor: pointer; margin-top: 6px; }
  #loadBtn { background: rgba(34,211,238,0.15); color: var(--cyan-bright); border: 1px solid var(--panel-border); }
  #trimBtn { background: linear-gradient(90deg, var(--cyan), var(--cyan-bright)); color: #021014; box-shadow: 0 0 25px rgba(34,211,238,0.4); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { margin-top: 14px; font-size: 0.82rem; text-align: center; min-height: 18px; }
  .status.error { color: var(--danger); }
  .status.success { color: var(--cyan-bright); }
  .status.info { color: var(--text-dim); }
  .hint { color: var(--text-dim); font-size: 0.72rem; margin-top: 4px; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="logo-dot"></span><h1>ClipForge</h1></div>
    <p class="subtitle">Paste a Pexels/Pixabay link, preview it, then trim up to 30 seconds — recorded live in your browser, no FFmpeg involved.</p>

    <div class="field">
      <label>Video URL</label>
      <input type="url" id="videoUrl" placeholder="https://www.pexels.com/video/..." />
    </div>
    <button id="loadBtn" type="button">▶ Load Preview</button>

    <video id="preview" controls playsinline crossorigin="anonymous"></video>

    <div class="row">
      <div class="field">
        <label>✂ Start Time (sec)</label>
        <input type="text" id="startTime" placeholder="0" />
      </div>
      <div class="field">
        <label>✂ End Time (sec)</label>
        <input type="text" id="endTime" placeholder="10" />
      </div>
    </div>
    <p class="hint">Recording takes roughly as long as the clip itself. Max: 30 seconds.</p>

    <button id="trimBtn" type="button" disabled>⬇ Record & Download</button>
    <div id="status" class="status"></div>
  </div>

  <script>
    const videoUrlInput = document.getElementById('videoUrl');
    const loadBtn = document.getElementById('loadBtn');
    const trimBtn = document.getElementById('trimBtn');
    const preview = document.getElementById('preview');
    const statusEl = document.getElementById('status');

    function setStatus(msg, type) {
      statusEl.textContent = msg || '';
      statusEl.className = 'status' + (type ? ' ' + type : '');
    }

    loadBtn.addEventListener('click', async () => {
      const url = videoUrlInput.value.trim();
      if (!url) { setStatus('Paste a video link first.', 'error'); return; }

      loadBtn.disabled = true;
      trimBtn.disabled = true;
      setStatus('Looking up the video…', 'info');

      try {
        const resp = await fetch('/api/resolve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || 'Could not resolve that link.');

        preview.src = '/api/stream?url=' + encodeURIComponent(data.videoUrl);
        preview.style.display = 'block';
        preview.load();
        trimBtn.disabled = false;
        setStatus('Preview loaded. Set your start/end time.', 'success');
      } catch (err) {
        setStatus(err.message, 'error');
      } finally {
        loadBtn.disabled = false;
      }
    });

    function pickMimeType() {
      const options = [
        'video/mp4;codecs=avc1',
        'video/webm;codecs=vp9,opus',
        'video/webm;codecs=vp8,opus',
        'video/webm',
      ];
      return options.find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
    }

    trimBtn.addEventListener('click', async () => {
      const start = parseFloat(document.getElementById('startTime').value);
      const end = parseFloat(document.getElementById('endTime').value);

      if (isNaN(start) || isNaN(end) || end <= start) {
        setStatus('Enter valid start/end seconds.', 'error');
        return;
      }
      const duration = end - start;
      if (duration > 30) {
        setStatus('Clips longer than 30 seconds are not supported.', 'error');
        return;
      }
      if (!window.MediaRecorder || typeof preview.captureStream !== 'function') {
        setStatus('This browser does not support in-browser recording.', 'error');
        return;
      }

      trimBtn.disabled = true;

      try {
        const mimeType = pickMimeType();
        const stream = preview.captureStream();
        const recorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
        const chunks = [];

        recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };

        const stopped = new Promise((resolve) => { recorder.onstop = resolve; });

        preview.currentTime = start;
        await new Promise((resolve) => {
          const onSeeked = () => { preview.removeEventListener('seeked', onSeeked); resolve(); };
          preview.addEventListener('seeked', onSeeked);
        });

        setStatus(`Recording ${duration.toFixed(1)}s clip…`, 'info');
        recorder.start();
        await preview.play();

        const stopAt = () => {
          if (preview.currentTime >= end) {
            preview.pause();
            recorder.stop();
            preview.removeEventListener('timeupdate', stopAt);
          }
        };
        preview.addEventListener('timeupdate', stopAt);

        // Safety timeout in case timeupdate doesn't fire precisely
        setTimeout(() => {
          if (recorder.state === 'recording') { preview.pause(); recorder.stop(); }
        }, (duration + 2) * 1000);

        await stopped;

        const blob = new Blob(chunks, { type: mimeType || 'video/webm' });
        const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
        const downloadUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = `trimmed-clip.${ext}`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(downloadUrl);

        setStatus('✅ Your clip is downloading now.', 'success');
      } catch (err) {
        console.error(err);
        setStatus('Recording failed: ' + err.message, 'error');
      } finally {
        trimBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
