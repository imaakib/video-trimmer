<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ClipForge — Trim &amp; Download HD</title>
<style>
  :root {
    --bg: #030712;
    --panel: rgba(255, 255, 255, 0.04);
    --panel-border: rgba(34, 211, 238, 0.25);
    --cyan: #22d3ee;
    --cyan-bright: #67e8f9;
    --text: #e5f6fb;
    --text-dim: #7c8b96;
    --danger: #f87171;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    position: relative;
    overflow-x: hidden;
  }

  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    z-index: 0;
    pointer-events: none;
  }
  body::before {
    width: 500px; height: 500px;
    background: rgba(34, 211, 238, 0.18);
    top: -150px; left: -150px;
  }
  body::after {
    width: 450px; height: 450px;
    background: rgba(103, 232, 249, 0.12);
    bottom: -150px; right: -150px;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 24px;
    padding: 40px 36px;
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.02) inset,
      0 20px 60px rgba(0,0,0,0.6),
      0 0 40px rgba(34, 211, 238, 0.08);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }

  .brand .logo-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 12px 3px var(--cyan);
  }

  .brand h1 {
    font-size: 1.4rem;
    margin: 0;
    letter-spacing: 0.5px;
    font-weight: 700;
    background: linear-gradient(90deg, #ffffff, var(--cyan-bright));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 0.88rem;
    margin: 0 0 28px 0;
    line-height: 1.5;
  }

  label {
    display: block;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--cyan-bright);
    margin-bottom: 8px;
    font-weight: 600;
  }

  .field {
    margin-bottom: 20px;
  }

  input[type="text"], input[type="url"] {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.03);
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
  }

  input[type="text"]::placeholder, input[type="url"]::placeholder {
    color: #4b5a63;
  }

  input[type="text"]:focus, input[type="url"]:focus {
    border-color: var(--cyan);
    background: rgba(34, 211, 238, 0.05);
    box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.15), 0 0 20px rgba(34, 211, 238, 0.25);
  }

  .time-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .time-label {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .scissor {
    display: inline-block;
    color: var(--cyan);
    text-shadow: 0 0 8px var(--cyan);
  }

  button#trimBtn {
    width: 100%;
    margin-top: 8px;
    padding: 16px;
    border: none;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #021014;
    background: linear-gradient(90deg, var(--cyan), var(--cyan-bright));
    cursor: pointer;
    box-shadow: 0 0 25px rgba(34, 211, 238, 0.45), 0 8px 20px rgba(0,0,0,0.4);
    transition: transform 0.15s ease, box-shadow 0.25s ease, opacity 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  button#trimBtn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 0 40px rgba(34, 211, 238, 0.65), 0 10px 24px rgba(0,0,0,0.45);
  }

  button#trimBtn:active:not(:disabled) {
    transform: translateY(0px);
  }

  button#trimBtn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .spinner {
    width: 18px; height: 18px;
    border: 2.5px solid rgba(2,16,20,0.3);
    border-top-color: #021014;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: none;
  }

  .spinner.active { display: inline-block; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .status {
    margin-top: 18px;
    font-size: 0.85rem;
    text-align: center;
    min-height: 20px;
    transition: color 0.2s ease;
  }

  .status.error { color: var(--danger); }
  .status.success { color: var(--cyan-bright); }
  .status.info { color: var(--text-dim); }

  .hint {
    color: var(--text-dim);
    font-size: 0.72rem;
    margin-top: 6px;
  }

  @media (max-width: 480px) {
    .time-row { grid-template-columns: 1fr; }
    .card { padding: 28px 22px; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="brand">
      <span class="logo-dot"></span>
      <h1>ClipForge</h1>
    </div>
    <p class="subtitle">
      Paste a direct video link from Pexels, Pixabay, Coverr, or any direct
      .mp4 URL. Trim it precisely and download the HD clip instantly.
    </p>

    <form id="trimForm">
      <div class="field">
        <label for="videoUrl">Video URL</label>
        <input
          type="url"
          id="videoUrl"
          name="videoUrl"
          placeholder="https://videos.pexels.com/video-files/.../video.mp4"
          required
        />
      </div>

      <div class="time-row">
        <div class="field">
          <label class="time-label"><span class="scissor">✂</span> Start Time</label>
          <input type="text" id="startTime" name="startTime" placeholder="00:00:00" required />
        </div>
        <div class="field">
          <label class="time-label"><span class="scissor">✂</span> End Time</label>
          <input type="text" id="endTime" name="endTime" placeholder="00:00:10" required />
        </div>
      </div>
      <p class="hint">Format: HH:MM:SS, MM:SS, or plain seconds (e.g. 12.5).</p>

      <button id="trimBtn" type="submit">
        <span class="spinner" id="spinner"></span>
        <span id="btnLabel">⬇ Download HD</span>
      </button>

      <div id="status" class="status"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('trimForm');
    const btn = document.getElementById('trimBtn');
    const btnLabel = document.getElementById('btnLabel');
    const spinner = document.getElementById('spinner');
    const statusEl = document.getElementById('status');

    function setStatus(message, type) {
      statusEl.textContent = message || '';
      statusEl.className = 'status' + (type ? ' ' + type : '');
    }

    function setLoading(isLoading) {
      btn.disabled = isLoading;
      spinner.classList.toggle('active', isLoading);
      btnLabel.textContent = isLoading ? 'Processing…' : '⬇ Download HD';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const url = document.getElementById('videoUrl').value.trim();
      const start = document.getElementById('startTime').value.trim();
      const end = document.getElementById('endTime').value.trim();

      if (!url || !start || !end) {
        setStatus('Please fill in the video URL, start time, and end time.', 'error');
        return;
      }

      setLoading(true);
      setStatus('Fetching and trimming your clip — this can take a moment…', 'info');

      try {
        const response = await fetch('/api/trim', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, start, end }),
        });

        if (!response.ok) {
          let message = 'Something went wrong while trimming the video.';
          try {
            const data = await response.json();
            if (data && data.error) message = data.error;
          } catch (_) { /* ignore parse errors */ }
          throw new Error(message);
        }

        const blob = await response.blob();
        const downloadUrl = window.URL.createObjectURL(blob);

        const disposition = response.headers.get('Content-Disposition') || '';
        const match = disposition.match(/filename="?([^"]+)"?/);
        const filename = match ? match[1] : 'trimmed-clip.mp4';

        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(downloadUrl);

        setStatus('✅ Your HD clip is downloading now.', 'success');
      } catch (err) {
        setStatus(err.message || 'Failed to trim the video.', 'error');
      } finally {
        setLoading(false);
      }
    });
  </script>

</body>
  </html>
